services:
  postgres:
    image: postgres:16-alpine
    container_name: stap-postgres
    restart: unless-stopped
    ports:
      - '5000:5432'
    environment:
      POSTGRES_DB: stap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d stap_db']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
